<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="프로젝트 상세 내용" />
  <meta name="color-scheme" content="light dark" />
  <title>Project | Seongguk Park</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html" aria-label="포트폴리오 홈으로 이동">
        <span class="brand-mark" id="brandMark">SP</span>
        <span id="brandName">Seongguk Park</span>
      </a>
      <div class="header-actions">
        <a class="button project-list-button" href="./index.html#projects">프로젝트 목록</a>
        <button class="icon-button" id="themeToggle" type="button" aria-label="테마 변경" title="테마 변경">
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div id="projectContent" hidden>
      <section class="project-hero">
        <div class="container">
          <a class="project-back" href="./index.html#projects">← 프로젝트 목록으로</a>
          <p class="eyebrow" id="projectEyebrow"></p>
          <h1 class="project-title" id="projectTitle"></h1>
          <p class="project-lead" id="projectSummary"></p>
        </div>
      </section>

      <section class="section muted-section">
        <div class="container project-detail-layout">
          <div class="project-sections" id="projectSections"></div>
          <aside class="project-summary-card" aria-label="프로젝트 요약">
            <h2>한눈에 보기</h2>
            <dl class="project-summary-list" id="projectFacts"></dl>
            <div class="tag-list" id="projectSkills" aria-label="사용 기술"></div>
          </aside>
        </div>
      </section>
    </div>

    <section class="project-not-found container" id="projectNotFound" hidden>
      <div>
        <h1>프로젝트를 찾을 수 없습니다.</h1>
        <p>주소가 올바른지 확인하거나 프로젝트 목록으로 돌아가 주세요.</p>
        <a class="button primary" href="./index.html#projects">프로젝트 목록 보기</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> <span id="footerName"></span></p>
      <a href="#main">맨 위로</a>
    </div>
  </footer>

  <script src="./content.js"></script>
  <script src="./project.js"></script>
</body>
</html>
